<!DOCTYPE html>
<html>
<head>
  <title>Task Queue</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 2rem; }
    h1 { font-size: 1.2rem; font-weight: 500; color: #888; }
    .grid { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .card { background: #1c1c1f; border-radius: 8px; padding: 1.25rem 2rem; min-width: 120px; }
    .label { font-size: 0.75rem; text-transform: uppercase; color: #888; letter-spacing: 0.05em; }
    .value { font-size: 2.5rem; font-variant-numeric: tabular-nums; margin-top: 0.25rem; }
    .dead .value { color: #e5484d; }
  </style>
</head>
<body>
  <h1>Task Queue</h1>
  <div class="grid">
    <div class="card"><div class="label">Pending</div><div class="value" id="pending">–</div></div>
    <div class="card"><div class="label">Processing</div><div class="value" id="processing">–</div></div>
    <div class="card"><div class="label">Delayed</div><div class="value" id="delayed">–</div></div>
    <div class="card dead"><div class="label">Dead</div><div class="value" id="dead">–</div></div>
  </div>
  <script>
    async function poll() {
      try {
        const res = await fetch('/stats');
        const s = await res.json();
        for (const k of ['pending', 'processing', 'delayed', 'dead']) {
          document.getElementById(k).textContent = s[k];
        }
      } catch (e) {
        console.error(e);
      }
    }
    poll();
    setInterval(poll, 1000);
  </script>
</body>
</html>
